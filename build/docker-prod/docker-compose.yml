services:
    mariadb-prod:
        container_name: dolibarr-mariadb-prod
        image: mariadb:latest
        environment:
            - MYSQL_ROOT_PASSWORD=root
            - MYSQL_DATABASE=smart_stock
        volumes:
            - dolibarr_db_data:/var/lib/mysql

    web:
        container_name: dolibarr-web-prod
        build: .

        volumes:
         - ../../htdocs:/var/www/html/
         - ../../documents:/var/www/html/documents

        depends_on:
            - mariadb-prod
        environment:
            - HOST_USER_ID=${HOST_USER_ID}
            - HOST_GROUP_ID=${HOST_GROUP_ID}
            - DOLI_ROOT_PASSWORD=root
            - DOLI_DATABASE=smart_stock
            - DOLI_DB_SERVER=mariadb-prod
        ports:
            - "8089:80"
    
    phpmyadmin:
        image: phpmyadmin/phpmyadmin
        container_name: dolibarr-phpmyadmin-prod
        environment:
            - PMA_HOST=mariadb-prod
            - MYSQL_ROOT_PASSWORD=root
        depends_on:
            - mariadb-prod
        ports:
            - "8080:80"

volumes:
    dolibarr_db_data:
